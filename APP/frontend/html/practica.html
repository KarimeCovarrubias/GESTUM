<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestum · Práctica</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_practica.css') }}">
</head>
<body>
    <header class="practica-topbar">
        <a href="{{ url_for('vista_user_home') }}" class="icon-btn" aria-label="Salir de la lección">✕</a>
        <div class="progreso-track">
            <div id="progreso-fill" class="progreso-fill" style="width:0%"></div>
        </div>
        <div class="vidas" aria-label="Vidas restantes">
            <span class="icon">❤️</span><span id="vidas-val">5</span>
        </div>
    </header>

    <main class="practica-wrap">
        <h1 id="leccion-titulo">{{ leccion.titulo }}</h1>
        <p class="letra-actual">Muestra la letra: <strong id="letra-objetivo">?</strong></p>

        <div class="practica-grid">
            <div class="referencia-box">
                <div class="referencia-placeholder" id="referencia-placeholder"></div>
                <img id="referencia-img" class="referencia-img" hidden alt="Referencia de la seña">
            </div>

            <div class="camara-box">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas" hidden></canvas>
                <div id="camara-overlay" class="camara-overlay">Iniciando cámara…</div>
            </div>
        </div>

        <div id="pantalla-completa" class="completada" hidden>
            <h2>¡Lección completada! 🎉</h2>
            <a href="{{ url_for('vista_user_home') }}" class="btn-primary-glow">Volver al inicio</a>
        </div>
    </main>

    <!-- Barra fija inferior para el flujo de la lección -->
    <footer id="feedback-bar" class="feedback-bar">
        <div class="feedback-info" id="feedback-info">
            <span id="feedback-icon" class="feedback-icon">➔</span>
            <div>
                <p id="feedback-titulo" class="feedback-titulo">¿Listo para avanzar?</p>
                <p id="feedback-sub" class="feedback-sub">Realiza la seña o avanza manualmente.</p>
            </div>
        </div>
        <button id="btn-continuar" class="btn-continuar">Siguiente Letra</button>
    </footer>

    <script>
        window.LECCION = {
            id: {{ leccion.id | tojson }},
            titulo: {{ leccion.titulo | tojson }},
            letras: {{ leccion.letras | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/practica.js') }}"></script>
</body>
</html>
