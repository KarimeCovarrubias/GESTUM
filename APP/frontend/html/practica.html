<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestum · Práctica</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_practica.css') }}">
</head>
<body>
    <a href="{{ url_for('vista_user_home') }}" class="back-link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Volver al inicio</span>
    </a>

    <main class="practica-wrap">
        <h1 id="leccion-titulo">{{ leccion.titulo }}</h1>
        <p class="letra-actual">Muestra la letra: <strong id="letra-objetivo">?</strong></p>

        <div class="camara-box">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" hidden></canvas>
            <div id="feedback-overlay" class="feedback">Iniciando cámara…</div>
        </div>

        <div class="progreso-leccion">
            <span id="progreso-texto">0 / 0</span>
            <div class="progreso-track">
                <div id="progreso-fill" class="progreso-fill" style="width:0%"></div>
            </div>
        </div>

        <div id="pantalla-completa" class="completada" hidden>
            <h2>¡Lección completada! 🎉</h2>
            <a href="{{ url_for('vista_user_home') }}" class="btn-primary-glow">Volver al inicio</a>
        </div>
    </main>

    <script>
        // Datos de la lección, inyectados por Flask desde curriculum.py
        window.LECCION = {
            id: {{ leccion.id | tojson }},
            titulo: {{ leccion.titulo | tojson }},
            letras: {{ leccion.letras | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/practica.js') }}"></script>
</body>
</html>
