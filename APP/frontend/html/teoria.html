<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestum · Teoría {{ leccion.titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_practica.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_teoria.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_salir_leccion.css') }}">
</head>
<body>
    <header class="practica-topbar">
        <a href="{{ url_for('vista_user_home') }}" class="icon-btn" data-salir aria-label="Salir de la lección">✕</a>
        <div class="progreso-track">
            <div id="progreso-fill" class="progreso-fill" style="width:0%"></div>
        </div>
    </header>

    <main class="teoria-wrap">
        <p class="eyebrow">Antes de practicar</p>
        <h1>{{ leccion.titulo }}</h1>

        {% if leccion.intro_bloque %}
        <p class="intro-bloque">{{ leccion.intro_bloque }}</p>
        {% endif %}

        <section class="letra-card">
            <div class="letra-card-head">
                <span id="letra-nombre" class="letra-grande"></span>
                <span id="letra-contador" class="letra-contador"></span>
            </div>

            <div class="media-grid">
                <div class="media-col">
                    <h3>Imagen de referencia</h3>
                    <div id="imagen-box" class="media-box"></div>
                </div>
                <div class="media-col">
                    <h3>Video Explicativo</h3>
                    <div id="video-box" class="media-box"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="teoria-footer">
        <button id="btn-siguiente" class="btn-continuar" type="button">Siguiente Letra</button>
    </footer>

    <script>
        window.STATIC_BASE = {{ url_for('static', filename='') | tojson }};
        window.LECCION = {
            id: {{ leccion.id | tojson }},
            titulo: {{ leccion.titulo | tojson }},
            letras: {{ leccion.letras | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/salir_leccion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/teoria.js') }}"></script>
</body>
</html>
