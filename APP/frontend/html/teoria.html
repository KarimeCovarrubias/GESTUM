<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestum · {{ leccion.titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_teoria.css') }}">
</head>
<body>
    <header class="teoria-topbar">
        <a href="{{ url_for('vista_user_home') }}" class="back-link" title="Volver al inicio">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Volver al inicio</span>
        </a>
    </header>

    <main class="teoria-wrap">
        <p class="eyebrow">Antes de practicar</p>
        <h1>{{ leccion.titulo }}</h1>

        {% if leccion.intro_bloque %}
        <p class="intro-bloque">{{ leccion.intro_bloque }}</p>
        {% endif %}

        <div class="letra-card">
            <div class="letra-header">
                <h2 id="letra-nombre" class="letra-nombre">?</h2>
                <span id="letra-contador" class="letra-progreso">1 / 1</span>
            </div>

            <!-- Grilla en 2 columnas para Imagen + Video -->
            <div class="media-grid">
                <div class="media-column">
                    <span class="media-tag">Imagen de referencia</span>
                    <div class="media-box" id="media-box-img">
                        <span class="placeholder-icon">🤟</span>
                    </div>
                </div>

                <div class="media-column">
                    <span class="media-tag">Video Explicativo</span>
                    <div class="media-box" id="media-box-video">
                        <span class="placeholder-icon">🎥</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Barra de navegación fija al final -->
    <footer class="teoria-footer">
        <button id="btn-siguiente" class="btn-primary-glow">Siguiente Letra</button>
    </footer>

    <script>
        window.LECCION = {
            id: {{ leccion.id | tojson }},
            titulo: {{ leccion.titulo | tojson }},
            letras: {{ leccion.letras | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/teoria.js') }}"></script>
</body>
</html>
