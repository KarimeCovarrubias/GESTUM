<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestum · Inicio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_user-home.css') }}">
</head>

<body>
    <div class="app-shell">
        <!-- Barra lateral: solo visible en escritorio -->
        <aside class="sidebar">
            <img class="logo" src="{{ url_for('static', filename='imagenes/logo.png') }}" alt="Gestum">
            <nav class="sidebar-nav">
                <div class="nav-item active"><span class="icon">🏠</span>Inicio</div>
                <div class="nav-item"><span class="icon">📚</span>Lecciones</div>
                <div class="nav-item"><span class="icon">🏆</span>Ranking</div>
                <div class="nav-item"><span class="icon">👤</span>Perfil</div>
            </nav>
            
            <!-- Botón de Cerrar Sesión en la barra lateral -->
            <div class="sidebar-footer">
                <a href="/api/logout" class="nav-item nav-item--logout">
                    <img src="{{ url_for('static', filename='imagenes/cerrar-sesion.png') }}" alt="Cerrar sesión" class="icon-img">
                    Cerrar sesión
                </a>
            </div>
        </aside>

        <div class="main-column">
            <header class="topbar">
                <img class="logo logo--mobile" src="{{ url_for('static', filename='imagenes/logo.png') }}" alt="Gestum">
                <div class="stat-row">
                    <div class="stat stat--vidas" aria-label="Vidas restantes"><span class="icon">❤️</span>5</div>
                    <div class="stat stat--racha" aria-label="Racha de práctica"><span class="icon">🔥</span><span id="racha-val">0</span></div>
                    <div class="stat stat--estrellas" aria-label="Estrellas acumuladas"><span class="icon">⭐</span><span id="xp-val">0</span></div>
                </div>
                
                <!-- Menú desplegable en el Avatar -->
                <div class="user-menu-wrapper">
                    <button class="avatar" id="user-avatar" type="button" aria-haspopup="true" aria-expanded="false">?</button>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="dropdown-header">
                            <span id="dropdown-username">Usuario</span>
                        </div>
                        <a href="/api/logout" class="dropdown-item dropdown-item--logout">
                            <img src="{{ url_for('static', filename='imagenes/cerrar-sesion.png') }}" alt="Cerrar sesión" class="icon-img">
                            Cerrar sesión
                        </a>
                    </div>
                </div>
            </header>

            <section class="hero">
                <div class="hero-inner">
                    <p class="eyebrow">Buenas tardes</p>
                    <h1 id="user-greeting">¡Hola!</h1>
                    <p class="sub" id="hero-sub">Cargando tu progreso…</p>
                    <!-- Cambiado a enlace <a> con id="btn-continuar-leccion" -->
                    <a href="#" class="cta" id="btn-continuar-leccion">Continuar lección</a>
                </div>
            </section>

            <main class="content"></main>
        </div>
    </div>

    <!-- Nav inferior: solo visible en móvil -->
    <nav class="bottom-nav">
        <div class="nav-item active"><span class="icon">🏠</span>Inicio</div>
        <div class="nav-item"><span class="icon">📚</span>Lecciones</div>
        <div class="nav-item"><span class="icon">🏆</span>Ranking</div>
        <div class="nav-item"><span class="icon">👤</span>Perfil</div>
    </nav>

    <script src="{{ url_for('static', filename='js/user-home.js') }}"></script>
</body>
</html>
